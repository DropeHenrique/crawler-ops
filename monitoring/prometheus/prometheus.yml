global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: monitor
    metrics_path: /metrics/
    static_configs:
      - targets: ["monitor:8090"]

  # Descobre todas as réplicas do worker via DNS do Docker (como o Cloud Map no ECS).
  - job_name: crawler-worker
    dns_sd_configs:
      - names: ["crawler-worker"]
        type: A
        port: 9100
