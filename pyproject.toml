[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlerops"
version = "0.1.0"
description = "Laboratório de sustentação de crawlers: captura, monitoramento, incidentes P1/P2/P3 e SLA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13,<5",
    "boto3>=1.40,<2",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.21,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "moto[s3,sqs,sns]>=5.1,<6",
    "respx>=0.22,<1",
    "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crawlerops.monitor" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "lambdas", "services"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["airflow/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
